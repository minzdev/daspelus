# DASPESLUS — Nginx untuk daspelus.web.id
# Taruh di: /etc/nginx/sites-available/daspeslus
# Aktifkan: ln -s /etc/nginx/sites-available/daspeslus /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx

# HTTP -> HTTPS (certbot akan mengelola blok ini setelah TLS terbit;
#  baris listen 80 di bawah aman dipakai sebelum/sesudah certbot)
server {
    listen 80;
    server_name daspelus.web.id;

    # Frontend hasil build (client/dist)
    root /var/www/daspeslus/client/dist;
    index index.html;

    # API backend
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA fallback (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache aset statis fingerprinted
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
