# DASPESLUS — auto-deploy ke VPS SumoPod setiap push ke branch main.
#
# Secrets yang wajib diisi di GitHub (Settings → Secrets and variables → Actions):
#   VPS_HOST  - IP publik VPS (contoh: 103.xxx.xxx.xxx)
#   VPS_USER  - user deploy (contoh: daspeslus)
#   VPS_SSH_KEY - isi private key SSH (tanpa passphrase) yang public key-nya
#                 sudah dipasang di ~/.ssh/authorized_keys user deploy di VPS
#   APP_DIR   - folder aplikasi di VPS (contoh: /var/www/daspeslus)
#
# Catatan: .env TIDAK ikut dari repo — dikelola manual di VPS (sekali saja).

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # tombol manual "Run workflow" bila perlu deploy ulang

jobs:
  deploy:
    # Jalan otomatis bila DEPLOY_ENABLED=true di GitHub Variables,
    # atau bila ditekan manual lewat tab Actions (Run workflow)
    if: ${{ vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Cek kelengkapan secrets
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ] && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_USER }}" ] && missing="$missing VPS_USER"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && missing="$missing VPS_SSH_KEY"
          [ -z "${{ secrets.APP_DIR }}" ] && missing="$missing APP_DIR"
          if [ -n "$missing" ]; then
            echo "::error::Secrets belum lengkap:$missing — isi di repo Settings → Secrets and variables → Actions → Repository secrets (bukan Environment/Variables)."
            exit 1
          fi
          echo "Semua secrets deploy terisi. Lanjut SSH ke VPS."
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            echo "== git pull =="
            git pull origin main
            echo "== install =="
            npm run install:all
            echo "== build frontend =="
            npm run build:client
            echo "== reload backend (zero-downtime) =="
            pm2 reload daspeslus-api || (cd ${{ secrets.APP_DIR }}/server && pm2 start src/index.js --name daspeslus-api)
            pm2 save
            echo "== selesai =="
            pm2 list
